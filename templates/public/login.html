<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="container">

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <div class ="side-message">
        <h2> Bienvenue </h2>
        <p>Accede facilement a ton espace personnel.</p>
        <p>Entre ton <strong>email</strong> et ton <strong>mot de passe</strong> pour te connecter.</p>
    </div>

    <div class="form-box">
        <h2>Connexion</h2>
        <form method="POST" action="{{ url_for('public_login') }}">
            <label>Mot de passe</label>
            <input type="nom" name="nom" placeholder="nom" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>

            <p class="bottom-text">
                Pas encore inscrit ? <a href="/register">Créer un compte</a>
            </p>
        </form>
    </div>
</div>

</body>
</html>
