{% extends "layout.html" %}

{% block content %}
<h2>Nouveau Circuit Touristique</h2>

<form method="POST">
    <label>Nom</label>
    <input type="text" name="nom" required>

    <label>Description</label>
    <textarea name="description"></textarea>

    <label>Durée</label>
    <input type="text" name="duree">

    <label>Prix</label>
    <input type="number" step="0.01" name="prix">

    <label>Agence</label>
    <select name="agence_id">
        {% for agence in agences %}
        <option value="{{ agence.id }}">{{ agence.nom }}</option>
        {% endfor %}
    </select>

    <button type="submit">Créer le circuit</button>
</form>
{% endblock %}
