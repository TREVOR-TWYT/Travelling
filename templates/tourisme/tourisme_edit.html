{% extends "layout.html" %}

{% block content %}
<h2>Modifier le Circuit Touristique</h2>

<form method="POST">
    <label>Nom</label>
    <input type="text" name="nom" required value="{{ tour.nom }}">

    <label>Description</label>
    <textarea name="description">{{ tour.description }}</textarea>

    <label>Durée</label>
    <input type="text" name="duree" value="{{ tour.duree }}">

    <label>Prix</label>
    <input type="number" step="0.01" name="prix" value="{{ tour.prix }}">

    <label>Agence</label>
    <select name="agence_id">
        {% for agence in agences %}
        <option value="{{ agence.id }}" {% if tour.agence_id == agence.id %}selected{% endif %}>{{ agence.nom }}</option>
        {% endfor %}
    </select>

    <button type="submit">Mettre à jour</button>
</form>
{% endblock %}
