{% extends "admin/layout.html" %}

{% block content %}
<div class="form-container">
    <h2>Ajouter un nouveau personnel</h2>

    <form action="" method="POST" class="styled-form">
        <h3>Informations personnelles</h3>
        <div class="form-row">
            
            <div class="form-group half-width">
                <label for="nom">👤 Nom :</label>
                <input type="text" id="nom" name="nom" required placeholder="Nom de famille">
            </div>

            <div class="form-group half-width">
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="prenom" placeholder="Prénom(s)">
            </div>

        </div>

        <h3>Rôle et affectation</h3>
        <div class="form-row">
            
            <div class="form-group half-width">
                <label for="role">🛠️ Rôle :</label>
                <select id="role" name="role" required>
                    <option value="Chauffeur">Chauffeur</option>
                    <option value="Agent">Agent de billetterie</option>
                    <option value="Manager">Manager d'agence</option>
                    <option value="Controleur">Contrôleur de bord</option>
                    <option value="Livreur">Livreur</option>
                </select>
            </div>

            <div class="form-group half-width">
                <label for="id_agence">🏢 Agence :</label>
                <select id="id_agence" name="id_agence">
                    <option value="">— Aucune —</option>
                    {% for a in agences %}
                        <option value="{{ a.id_agence }}">{{ a.nom_agence }}</option>
                    {% endfor %}
                </select>
            </div>
            
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">➕ Créer le personnel</button>
            <a href="{{ url_for('crud.list_personnels') }}" class="btn-secondary">Retour à la liste</a>
        </div>
    </form>
</div>
{% endblock %}
