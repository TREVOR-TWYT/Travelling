{% extends "admin/layout.html" %}

{% block content %}

<style>
    /* Structure de base (Cohérent avec le reste) */
    .content-wrapper {
        padding: 40px 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        background-color: #f4f6f9;
    }

    .form-card {
        background: white;
        width: 100%;
        max-width: 650px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        border-top: 5px solid #1a1a2e;
    }

    /* En-tête */
    .form-header {
        text-align: center;
        margin-bottom: 35px;
        border-bottom: 1px solid #eee;
        padding-bottom: 20px;
    }

    .form-header h2 {
        margin: 0;
        color: #1a1a2e;
        font-size: 1.6rem;
    }

    /* Badge ID Personnel */
    .id-badge {
        display: inline-block;
        background-color: #e9ecef;
        color: #495057;
        padding: 4px 10px;
        border-radius: 15px;
        font-size: 0.9rem;
        font-family: monospace;
        vertical-align: middle;
        margin-left: 10px;
        border: 1px solid #ced4da;
    }

    /* Titres de section */
    .section-title {
        font-size: 0.85rem;
        text-transform: uppercase;
        color: #1a1a2e;
        letter-spacing: 1px;
        font-weight: 700;
        margin: 30px 0 20px 0;
        display: flex;
        align-items: center;
    }
    
    .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #eee;
        margin-left: 15px;
    }

    /* Grille */
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 15px;
    }

    .form-group { margin-bottom: 15px; }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
        font-size: 0.9rem;
    }

    /* Inputs et Selects */
    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        box-sizing: border-box;
        background-color: #fafafa;
        height: 48px;
    }

    .form-control:focus {
        border-color: #1a1a2e;
        background-color: #fff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(26, 26, 46, 0.1);
    }

    /* Bouton Submit */
    .btn-submit {
        width: 100%;
        padding: 15px;
        background-color: #1a1a2e;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s;
        margin-top: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .btn-submit:hover {
        background-color: #3b3b5c;
        transform: translateY(-2px);
    }

    /* Footer */
    .form-footer { text-align: center; margin-top: 20px; }
    .back-link { color: #666; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: #1a1a2e; text-decoration: underline; }

    @media (max-width: 600px) {
        .form-row { grid-template-columns: 1fr; gap: 0; }
    }
</style>

<div class="content-wrapper">
    <div class="form-card">
        
        <div class="form-header">
            <h2>Modifier Profil <span class="id-badge">#{{ personnel.id_personnel }}</span></h2>
        </div>

        <form action="" method="POST">
            
            <div class="section-title">👤 Identité & Civil</div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="nom">Nom de famille</label>
                    <input type="text" 
                           id="nom" 
                           name="nom" 
                           class="form-control" 
                           value="{{ personnel.nom }}" 
                           required>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom(s)</label>
                    <input type="text" 
                           id="prenom" 
                           name="prenom" 
                           class="form-control" 
                           value="{{ personnel.prenom }}">
                </div>
            </div>

            <div class="section-title">💼 Affectation & Poste</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="role">Rôle / Fonction</label>
                    <select id="role" name="role" class="form-control" required>
                        <option value="Chauffeur" {% if personnel.role == 'Chauffeur' %}selected{% endif %}>🚍 Chauffeur</option>
                        <option value="Agent" {% if personnel.role == 'Agent' %}selected{% endif %}>🎫 Agent de billetterie</option>
                        <option value="Manager" {% if personnel.role == 'Manager' %}selected{% endif %}>👔 Manager d'agence</option>
                        <option value="Controleur" {% if personnel.role == 'Controleur' %}selected{% endif %}>👮‍♂️ Contrôleur de bord</option>
                        <option value="Livreur" {% if personnel.role == 'Livreur' %}selected{% endif %}>📦 Livreur</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="id_agence">Agence de rattachement</label>
                    <select id="id_agence" name="id_agence" class="form-control">
                        <option value="">— Aucune (Siège / Mobile) —</option>
                        {% for a in agences %}
                            <option value="{{ a.id_agence }}" {% if personnel.id_agence == a.id_agence %}selected{% endif %}>
                                📍 {{ a.nom_agence }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                💾 Enregistrer les modifications
            </button>

        </form>

        <div class="form-footer">
            <a href="{{ url_for('crud.list_personnels') }}" class="back-link">
                Annuler et Retour à la liste
            </a>
        </div>

    </div>
</div>

{% endblock %}
