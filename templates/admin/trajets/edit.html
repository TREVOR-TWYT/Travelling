{% extends "admin/layout.html" %}

{% block content %}
<div class="form-container">
    <h2>Modifier le Trajet : {{ trajet.ville_depart }} → {{ trajet.ville_arrivee }}</h2>

    <form method="post" class="styled-form">
        <h3>Villes de départ et d'arrivée</h3>
        <div class="form-row">
            
            <div class="form-group half-width">
                <label for="ville_depart">📍 Ville de départ :</label>
                <input type="text" id="ville_depart" name="ville_depart" value="{{ trajet.ville_depart }}" required placeholder="Ex: Douala">
            </div>

            <div class="form-group half-width">
                <label for="ville_arrivee">🏁 Ville d'arrivée :</label>
                <input type="text" id="ville_arrivee" name="ville_arrivee" value="{{ trajet.ville_arrivee }}" required placeholder="Ex: Yaoundé">
            </div>

        </div>

        <h3>Tarification (FCFA)</h3>
        <div class="form-row">
            
            <div class="form-group half-width">
                <label for="tarif_standard">💲 Tarif standard :</label>
                <input type="number" id="tarif_standard" name="tarif_standard" value="{{ trajet.tarif_standard }}" required min="1000" placeholder="Ex: 6000">
            </div>

            <div class="form-group half-width">
                <label for="tarif_vip">💎 Tarif VIP :</label>
                <input type="number" id="tarif_vip" name="tarif_vip" value="{{ trajet.tarif_vip }}" required min="1000" placeholder="Ex: 10000">
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">💾 Enregistrer les modifications</button>
            <a href="{{ url_for('crud.trajets_list') }}" class="btn-secondary">Annuler et Retour</a>
        </div>
    </form>
</div>
{% endblock %}
