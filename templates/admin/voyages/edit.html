{% extends "admin/layout.html" %}
{% block content %}
<h2>Modifier le voyage #{{ voyage.id_voyage }}</h2>

<form action="" method="POST">
    <label>Trajet :</label>
    <select name="id_trajet" required>
        {% for t in trajets %}
            <option value="{{ t.id_trajet }}" {% if t.id_trajet == voyage.id_trajet %}selected{% endif %}>
                {{ t.ville_depart }} → {{ t.ville_arrivee }}
            </option>
        {% endfor %}
    </select><br><br>

    <label>Véhicule :</label>
    <select name="immatriculation" required>
        {% for veh in vehicules %}
            <option value="{{ veh.immatriculation }}" {% if veh.immatriculation == voyage.immatriculation %}selected{% endif %}>
                {{ veh.immatriculation }} ({{ veh.type }})
            </option>
        {% endfor %}
    </select><br><br>

    <label>Agence :</label>
    <select name="id_agence">
        <option value="">Aucune</option>
        {% for a in agences %}
            <option value="{{ a.id_agence }}" {% if a.id_agence == voyage.id_agence %}selected{% endif %}>
                {{ a.nom_agence }}
            </option>
        {% endfor %}
    </select><br><br>

    <label>Date de départ :</label>
    <input type="date" name="date_depart" value="{{ voyage.date_depart }}" required><br><br>

    <label>Heure de départ :</label>
    <input type="time" name="heure_depart" value="{{ voyage.heure_depart }}" required><br><br>

    <label>Standing :</label>
    <select name="standing" required>
        <option value="Standard" {% if voyage.standing == 'Standard' %}selected{% endif %}>Standard</option>
        <option value="VIP" {% if voyage.standing == 'VIP' %}selected{% endif %}>VIP</option>
    </select><br><br>

    <label>Places réservées :</label>
    <input type="number" name="places_reservees" value="{{ voyage.places_reservees }}"><br><br>

    <button type="submit">Enregistrer</button>
</form>

<a href="{{ url_for('crud.list_voyages') }}">Retour à la liste</a>
{% endblock %}
