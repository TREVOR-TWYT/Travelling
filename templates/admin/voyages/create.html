{% extends "admin/layout.html" %}

{% block content %}
<div class="form-container">
    <h2>Créer un nouveau voyage</h2>

    <form action="{{ url_for('crud.create_voyage') }}" method="POST" class="styled-form"> 
        <h3>Informations de base du voyage</h3>
        <div class="form-row">
            
            <div class="form-group half-width">
                <label for="id_trajet">📍 Trajet :</label>
                <select id="id_trajet" name="id_trajet" required>
                    {% for t in trajets %}
                        <option value="{{ t.id_trajet }}">{{ t.ville_depart }} → {{ t.ville_arrivee }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group half-width">
                <label for="immatriculation">🚌 Véhicule :</label>
                <select id="immatriculation" name="immatriculation" required>
                    {% for veh in vehicules %}
                        <option value="{{ veh.immatriculation }}">{{ veh.immatriculation }} ({{ veh.type }})</option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <h3>Horaires et Agence</h3>
        <div class="form-row">
            
            <div class="form-group half-width">
                <label for="date_depart">📅 Date de départ :</label>
                <input type="date" id="date_depart" name="date_depart" required>
            </div>

            <div class="form-group half-width">
                <label for="heure_depart">⏱️ Heure de départ :</label>
                <input type="time" id="heure_depart" name="heure_depart" required>
            </div>
        
        </div>

        <div class="form-row">

            <div class="form-group half-width">
                <label for="standing">⭐ Standing :</label>
                <select id="standing" name="standing" required>
                    <option value="Standard">Standard</option>
                    <option value="VIP">VIP</option>
                </select>
            </div>

            <div class="form-group half-width">
                <label for="places_reservees">🧑‍🤝‍🧑 Places réservées :</label>
                <input type="number" id="places_reservees" name="places_reservees" value="0" min="0" readonly> 
            </div>
            
        </div>
        
        <div class="form-group full-width">
            <label for="id_agence">🏢 Agence (Assignation) :</label>
            <select id="id_agence" name="id_agence">
                {% for a in agences %}
                    <option value="{{ a.id_agence }}">{{ a.nom_agence }}</option>
                {% endfor %}
            </select>
        </div>


        <div class="form-actions">
            <button type="submit" class="btn-primary">Créer le Voyage</button>
            <a href="{{ url_for('crud.list_voyages') }}" class="btn-secondary">Annuler et Retour à la liste</a>
        </div>
    </form>
</div>
{% endblock %}
