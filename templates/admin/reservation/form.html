{% extends "admin/layout.html" %}

{% block content %}

<style>
    /* Structure de base */
    .content-wrapper {
        padding: 40px 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        background-color: #f4f6f9; /* Fond page très léger */
    }

    .form-card {
        background: white;
        width: 100%;
        max-width: 700px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        border-top: 5px solid #1a1a2e; /* Petite touche de couleur en haut */
    }

    /* En-tête */
    .form-header {
        text-align: center;
        margin-bottom: 35px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
    }

    .form-header h2 {
        margin: 0;
        color: #1a1a2e;
        font-size: 1.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .form-header p {
        margin: 8px 0 0;
        color: #666;
        font-size: 0.95rem;
    }

    /* Titres de sections (Passager / Voyage) */
    .section-title {
        font-size: 0.9rem;
        text-transform: uppercase;
        color: #2c3e50;
        letter-spacing: 1px;
        font-weight: 700;
        margin: 30px 0 20px 0;
        padding-left: 10px;
        border-left: 4px solid #3498db; /* Barre bleue à gauche */
    }

    /* Grille et Layout */
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 15px;
    }

    .form-group { margin-bottom: 15px; }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
        font-size: 0.9rem;
    }

    /* Inputs Stylisés */
    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        box-sizing: border-box;
        background-color: #fafafa;
        height: 48px;
    }

    .form-control:focus {
        border-color: #3498db;
        background-color: #fff;
        outline: none;
        box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
    }

    /* Style spécifique pour le Select (Flèche) */
    select.form-control {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 15px top 50%;
        background-size: 10px auto;
        cursor: pointer;
    }

    /* Input Montant (Mise en valeur) */
    .input-money {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        color: #27ae60;
    }

    /* Bouton Confirmation */
    .btn-submit {
        width: 100%;
        padding: 16px;
        background-color: #1a1a2e; /* Couleur Thème */
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s;
        margin-top: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .btn-submit:hover {
        background-color: #2c3e50;
        transform: translateY(-2px);
    }

    /* Responsive */
    @media (max-width: 650px) {
        .form-row { grid-template-columns: 1fr; gap: 0; }
        .form-card { padding: 20px; }
    }
</style>

<div class="content-wrapper">
    <div class="form-card">
        
        <div class="form-header">
            <h2>🎟️ Guichet de Réservation</h2>
            <p>Saisissez les informations du client pour émettre un billet.</p>
        </div>

        <form action="/reservation" method="POST">

            <div class="section-title">1. Informations du Passager</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="nom">Nom de famille</label>
                    <input type="text" id="nom" name="nom" class="form-control" required placeholder="Ex: DOE">
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom(s)</label>
                    <input type="text" id="prenom" name="prenom" class="form-control" placeholder="Ex: John">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="telephone">Numéro de téléphone</label>
                    <input type="tel" id="telephone" name="telephone" class="form-control" required placeholder="Ex: 699 00 00 00">
                </div>
                <div class="form-group">
                    <label for="email">Adresse Email <small style="font-weight:normal; color:#888;">(Optionnel)</small></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="client@email.com">
                </div>
            </div>

            <div class="section-title">2. Détails du Billet & Paiement</div>

            <div class="form-group">
                <label for="id_voyage">Sélectionner le Voyage</label>
                <select id="id_voyage" name="id_voyage" class="form-control" required>
                    <option value="" disabled selected>-- Choisir Destination et Date --</option>
                    {% for v in voyages %}
                        <option value="{{ v.id_voyage }}">
                            🚩 {{ v.trajet.ville_depart }} ➝ {{ v.trajet.ville_arrivee }} 
                            | 📅 {{ v.date_depart }} à {{ v.heure_depart }} 
                            | ⭐ {{ v.standing }}
                        </option>
                    {% endfor %}
                </select>
                <small style="color: #666; margin-top: 5px; display:block;">Vérifiez bien la date et l'heure avant de sélectionner.</small>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="mode">Mode de paiement</label>
                    <select id="mode" name="mode" class="form-control" required>
                        <option value="" disabled selected>-- Moyen de paiement --</option>
                        <option value="Cash">💵 Espèces (Cash)</option>
                        <option value="Mobile Money">📱 Mobile Money (OM/MOMO)</option>
                        <option value="Carte bancaire">💳 Carte Bancaire</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="montant">Montant encaissé (FCFA)</label>
                    <input type="number" 
                           id="montant" 
                           name="montant" 
                           class="form-control input-money" 
                           required 
                           min="500" 
                           placeholder="Ex: 5000">
                </div>
            </div>
            
            <button type="submit" class="btn-submit">
                ✅ Confirmer la Réservation
            </button>
       
        </form>
    </div>
</div>

{% endblock %}
