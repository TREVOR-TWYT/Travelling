<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{% block title %}Admin - Travelling App{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Travelling App - Administration</h1>
        <nav>
            <a href="{{ url_for('crud.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('crud.list_agences') }}">Agences</a>
            <a href="{{ url_for('crud.list_personnels') }}">Personnels</a>
            <a href="{{ url_for('crud.list_vehicules') }}">Véhicules</a>
            <a href="{{ url_for('crud.trajets_list') }}">Trajets</a>
            <a href="{{ url_for('crud.list_voyages') }}">Voyages</a>
            <a href="{{ url_for('crud.list_clients') }}">Clients</a>
            <a href="{{ url_for('crud.reservation') }}">Réservations</a>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- Le contenu de chaque page ira ici -->
        {% endblock %}
    </main>

    <footer>
        <a href="{{ url_for('index') }}">Retour à l'accueil</a>
        &copy; 2025 Travelling App
    </footer>
</body>
</html>
