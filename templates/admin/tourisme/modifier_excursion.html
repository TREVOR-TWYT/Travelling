{% extends 'admin/layout.html' %}

{% block title %}Modifier l'excursion{% endblock %}

{% block breadcrumb %}Tourisme / Excursions / Modifier{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px;">
        <h2 style="margin: 0; color: #1e293b;">✏️ Modifier : {{ excursion.nom_excursion }}</h2>
        <a href="{{ url_for('tourism.admin_excursions') }}" style="text-decoration: none; color: #64748b; font-weight: 500;">← Retour</a>
    </div>

    <form method="POST" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div style="grid-column: 1 / -1;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Nom de l'excursion</label>
            <input type="text" name="nom_excursion" value="{{ excursion.nom_excursion }}" required 
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Site Touristique</label>
            <select name="id_site" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                {% for site in sites %}
                <option value="{{ site.id_site }}" {% if site.id_site == excursion.id_site %}selected{% endif %}>
                    {{ site.nom_site }} ({{ site.ville }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Statut</label>
            <select name="statut" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                <option value="Programmé" {% if excursion.statut == 'Programmé' %}selected{% endif %}>Programmé</option>
                <option value="En cours" {% if excursion.statut == 'En cours' %}selected{% endif %}>En cours</option>
                <option value="Terminé" {% if excursion.statut == 'Terminé' %}selected{% endif %}>Terminé</option>
                <option value="Annulé" {% if excursion.statut == 'Annulé' %}selected{% endif %}>Annulé</option>
            </select>
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Date de départ</label>
            <input type="date" name="date_depart" value="{{ excursion.date_depart.strftime('%Y-%m-%d') }}" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Heure de départ</label>
            <input type="time" name="heure_depart" value="{{ excursion.heure_depart.strftime('%H:%M') }}" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Places disponibles</label>
            <input type="number" name="nb_places_disponibles" value="{{ excursion.nb_places_disponibles }}" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Tarif (FCFA)</label>
            <input type="number" name="tarif_par_personne" value="{{ excursion.tarif_par_personne }}" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>

        <div style="grid-column: 1 / -1; margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" style="flex: 2; background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                Enregistrer les modifications
            </button>
            <button type="reset" style="flex: 1; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; cursor: pointer;">
                Réinitialiser
            </button>
        </div>
    </form>
</div>
{% endblock %}
