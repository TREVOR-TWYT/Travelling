{% extends "admin/layout.html" %}
{% block content %}
<h2>Modifier le véhicule {{ vehicule.immatriculation }}</h2>

<form action="" method="POST">
    <label>Type :</label>
    <input type="text" name="type" value="{{ vehicule.type }}" required><br><br>

    <label>Capacité :</label>
    <input type="number" name="capacite" value="{{ vehicule.capacite }}" required><br><br>

    <label>Statut :</label>
    <select name="statut">
        <option value="En service" {% if vehicule.statut == "En service" %}selected{% endif %}>En service</option>
        <option value="Hors service" {% if vehicule.statut == "Hors service" %}selected{% endif %}>Hors service</option>
    </select><br><br>

    <button type="submit">Enregistrer</button>
</form>

<a href="{{ url_for('crud.list_vehicules') }}">Retour à la liste</a>
{% endblock %}
