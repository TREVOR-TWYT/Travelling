{% extends "admin/layout.html" %}
{% block content %}

<div class="form-container compact-form">
    <h2>Modifier l'agence #{{ agence.id_agence }}</h2>

    <form method="POST" class="agence-edit-form">
        
        <div class="form-group full-width">
            <label for="nom_agence">Nom de l'agence :</label>
            <input type="text" 
                   id="nom_agence" 
                   name="nom_agence" 
                   value="{{ agence.nom_agence }}" 
                   required 
                   placeholder="Nom de l'agence">
        </div>

        <div class="form-group full-width">
            <label for="adresse">Adresse :</label>
            <input type="text" 
                   id="adresse" 
                   name="adresse" 
                   value="{{ agence.adresse or '' }}" 
                   placeholder="Adresse de l'agence (Optionnel)">
        </div>
        
        <div class="form-submit">
            <button type="submit" class="btn-primary">Enregistrer les modifications</button>
        </div>
    </form>

    <div class="back-link">
        <a href="{{ url_for('crud.list_agences') }}">← Retour à la liste des agences</a>
    </div>
</div>
{% endblock %}
