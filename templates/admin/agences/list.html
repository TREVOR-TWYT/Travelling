{% extends "admin/layout.html" %}
{% block content %}
<h2>Liste des agences</h2>

<a href="{{ url_for('crud.create_agence') }}">Créer une nouvelle agence</a>

<table border="1" cellpadding="5" cellspacing="0">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Adresse</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for a in agences %}
        <tr>
            <td>{{ a.id_agence }}</td>
            <td>{{ a.nom_agence }}</td>
            <td>{{ a.adresse }}</td>
            <td>
                <a href="{{ url_for('crud.edit_agence', id_agence=a.id_agence) }}">Modifier</a> |
                <form action="{{ url_for('crud.delete_agence', id_agence=a.id_agence) }}" method="POST" style="display:inline;">
                    <button type="submit" onclick="return confirm('Voulez-vous vraiment supprimer cette agence ?')">Supprimer</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
