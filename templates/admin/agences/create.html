{% extends "admin/layout.html" %}

{% block content %}

<style>
    /* Style identique à la page de modification pour la cohérence */
    .content-wrapper {
        padding: 40px 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start; /* Evite que le formulaire soit centré verticalement si la page est grande */
    }

    .form-card {
        background: white;
        width: 100%;
        max-width: 500px;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .form-header {
        text-align: center;
        margin-bottom: 30px;
        border-bottom: 1px solid #eee;
        padding-bottom: 20px;
    }

    .form-header h2 {
        margin: 0;
        color: #333;
        font-size: 1.5rem;
    }

    .form-header p {
        margin: 5px 0 0;
        color: #777;
        font-size: 0.9rem;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
        font-size: 0.95rem;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.3s, box-shadow 0.3s;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: #1a1a2e;
        outline: none;
        box-shadow: 0 0 0 3px rgba(26, 26, 46, 0.1);
    }

    .btn-submit {
        width: 100%;
        padding: 14px;
        background-color: #1a1a2e; /* Couleur principale */
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-top: 10px;
    }

    .btn-submit:hover {
        background-color: #3b3b5c;
    }

    .form-footer {
        text-align: center;
        margin-top: 25px;
    }

    .back-link {
        color: #666;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s;
    }

    .back-link:hover {
        color: #1a1a2e;
        text-decoration: underline;
    }
</style>

<div class="content-wrapper">
    <div class="form-card">
        
        <div class="form-header">
            <h2>Nouvelle Agence</h2>
            <p>Ajoutez un point de départ ou d'arrivée au réseau.</p>
        </div>

        <form method="POST">
            
            <div class="form-group">
                <label for="nom_agence">Nom de l'agence <span style="color:red">*</span></label>
                <input type="text" 
                       id="nom_agence" 
                       name="nom_agence" 
                       class="form-control" 
                       required 
                       placeholder="Ex: Agence Principale Yaoundé">
            </div>

            <div class="form-group">
                <label for="adresse">Adresse complète</label>
                <input type="text" 
                       id="adresse" 
                       name="adresse" 
                       class="form-control" 
                       placeholder="Ex: Quartier Mvog-Mbi, Rue 123">
            </div>
            
            <button type="submit" class="btn-submit">
                Créer l'agence
            </button>
        </form>

        <div class="form-footer">
            <a href="{{ url_for('crud.list_agences') }}" class="back-link">
                ← Annuler et retour à la liste
            </a>
        </div>

    </div>
</div>

{% endblock %}
