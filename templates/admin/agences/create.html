{% extends "admin/layout.html" %}

{% block content %}
<div class="form-container compact-form">
    <h2>Créer une nouvelle agence</h2>

    <form method="POST" class="agence-form">
        
        <div class="form-group full-width">
            <label for="nom_agence">Nom de l'agence :</label>
            <input type="text" id="nom_agence" name="nom_agence" required placeholder="Ex: Agence Principale Yaoundé">
        </div>

        <div class="form-group full-width">
            <label for="adresse">Adresse :</label>
            <input type="text" id="adresse" name="adresse" placeholder="Ex: Quartier Mvog-Mbi, Rue 123">
        </div>
        
        <div class="form-submit">
            <button type="submit" class="btn-primary">Créer l'agence</button>
        </div>
    </form>

    <div class="back-link">
        <a href="{{ url_for('crud.list_agences') }}">← Retour à la liste</a>
    </div>
</div>
{% endblock %}
