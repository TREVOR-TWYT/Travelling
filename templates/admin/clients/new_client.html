{% extends "admin/layout.html" %}

{% block content %}
<div class="form-container">
    <h2>Créer un nouveau client</h2>

    <form method="POST" class="client-form">

        <div class="form-row">
            <div class="form-group half-width">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" required placeholder="Nom de famille">
            </div>

            <div class="form-group half-width">
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="prenom" placeholder="Prénom(s)">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group half-width">
                <label for="telephone">Téléphone :</label>
                <input type="tel" id="telephone" name="telephone" required placeholder="+XXX XXX XXX XX">
            </div>

            <div class="form-group half-width">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" placeholder="example@domaine.com (Optionnel)">
            </div>
        </div>

        <div class="form-group full-width">
            <label for="cni">Numéro CNI / Pièce d'identité :</label>
            <input type="text" id="cni" name="cni" placeholder="Numéro de la carte d'identité (Optionnel)">
        </div>

        <div class="form-submit">
            <button type="submit" class="btn-primary">Créer le client</button>
        </div>
    </form>
</div>
{% endblock %}
