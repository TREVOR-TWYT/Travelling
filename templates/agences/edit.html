{% extends "admin/layout.html" %}

{% block title %}Modifier l'Agence - Admin{% endblock %}

{% block content %}
<h2 class="page-title">Modifier l'Agence</h2>

<form method="POST" action="{{ url_for('crud.edit_agence', id_agence=agence.id_agence) }}">
    <div class="form-group">
        <label for="nom_agence">Nom de l'agence *</label>
        <input type="text" id="nom_agence" name="nom_agence" value="{{ agence.nom_agence }}" required>
    </div>

    <div class="form-group">
        <label for="adresse">Adresse *</label>
        <input type="text" id="adresse" name="adresse" value="{{ agence.adresse }}" required>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-success">💾 Enregistrer les modifications</button>
        <a href="{{ url_for('crud.list_agences') }}" class="btn btn-secondary">❌ Annuler</a>
    </div>
</form>
{% endblock %}
