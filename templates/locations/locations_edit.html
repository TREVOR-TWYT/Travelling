{% extends "layout.html" %}

{% block content %}
<h2>Modifier la Location</h2>

<form method="POST">
    <label>Client</label>
    <select name="client_id">
        {% for client in clients %}
        <option value="{{ client.id_client }}" {% if location.client_id == client.id_client %}selected{% endif %}>{{ client.nom }} {{ client.prenom }}</option>
        {% endfor %}
    </select>

    <label>Véhicule</label>
    <select name="vehicule_id">
        {% for veh in vehicules %}
        <option value="{{ veh.id }}" {% if location.vehicule_id == veh.id %}selected{% endif %}>{{ veh.nom }}</option>
        {% endfor %}
    </select>

    <label>Date début</label>
    <input type="date" name="date_debut" required value="{{ location.date_debut }}">

    <label>Date fin</label>
    <input type="date" name="date_fin" required value="{{ location.date_fin }}">

    <label>Prix total</label>
    <input type="number" step="0.01" name="prix_total" required value="{{ location.prix_total }}">

    <label>Statut</label>
    <input type="text" name="statut" value="{{ location.statut }}">

    <button type="submit">Mettre à jour</button>
</form>
{% endblock %}
