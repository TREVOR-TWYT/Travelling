<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Travelling App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Travelling App</h1>
        <nav>
            <a href="{{ url_for('crud.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('crud.list_agences') }}">Agences</a>
            <a href="{{ url_for('crud.list_personnels') }}">Personnels</a>
            <a href="{{ url_for('crud.list_vehicules') }}">Véhicules</a>
            <a href="{{ url_for('crud.trajets_list') }}">Trajets</a>
            <a href="{{ url_for('crud.list_voyages') }}">Voyages</a>
            <a href="{{ url_for('crud.list_clients') }}">Clients</a>
            <a href="{{ url_for('crud.reservation') }}">Réservations</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; {{ current_year if current_year else "2025" }} Travelling App
    </footer>
</body>
</html>
