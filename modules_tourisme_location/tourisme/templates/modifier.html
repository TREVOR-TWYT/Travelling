<h1>Modifier une activité</h1>
<form method='POST'>
  Nom: <input name='nom' value='{{ tour.nom }}'><br>
  Description: <textarea name='description'>{{ tour.description }}</textarea><br>
  Prix: <input name='prix' type='number' step='0.01' value='{{ tour.prix }}'><br>
  <button type='submit'>Modifier</button>
</form>
