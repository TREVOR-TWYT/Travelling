<h1>Modifier un véhicule</h1>
<form method='POST'>
  Marque: <input name='marque' value='{{ vehicule.marque }}'><br>
  Modèle: <input name='modele' value='{{ vehicule.modele }}'><br>
  Prix/jour: <input name='prix_jour' type='number' step='0.01' value='{{ vehicule.prix_jour }}'><br>
  <button type='submit'>Modifier</button>
</form>
