<h1>Liste des véhicules</h1>
<a href='/vehicules/ajouter'>Ajouter</a>
<ul>
{% for vehicule in vehicules %}
  <li>{{ vehicule.marque }} {{ vehicule.modele }} - {{ vehicule.prix_jour }}$/jour
    <a href='/vehicules/modifier/{{ vehicule.id }}'>Modifier</a>
    <a href='/vehicules/supprimer/{{ vehicule.id }}'>Supprimer</a>
  </li>
{% endfor %}
</ul>
